<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SnapSTL Helper</title>
<style>
:root{--bg:#fff;--line:#e3e1db;--text:#1f1e1c;--muted:#6b6a65;--accent:#1f6fd1;--ok:#2e7d32;--err:#b42318;--warn:#8a5a00}
@media (prefers-color-scheme:dark){:root{--bg:#242423;--line:#3a3936;--text:#ecebe6;--muted:#a19f98;--accent:#6aa5ee;--ok:#8fd18f;--err:#f19a90;--warn:#f0c46a}}
body{margin:0;width:320px;padding:14px;font:13px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
h1{font-size:15px;margin:0 0 10px;font-weight:600}
.row{display:flex;justify-content:space-between;gap:8px;margin:5px 0}
.row span:last-child{text-align:right}
.ok{color:var(--ok)}.err{color:var(--err)}.warn{color:var(--warn)}
.status{margin-top:10px;padding:8px;border:1px solid var(--line);border-radius:6px;min-height:18px}
button{width:100%;margin-top:8px;font:inherit;padding:7px;border-radius:6px;border:1px solid var(--line);background:transparent;color:var(--text);cursor:pointer}
button.primary{border:0;background:var(--accent);color:#fff}
button:disabled{opacity:.5;cursor:default}
.hint{color:var(--muted);font-size:12px;margin-top:8px}
.model{font-size:12px;color:var(--muted);word-break:break-all}
</style>
</head>
<body>
  <h1>SnapSTL Helper</h1>
  <div class="row"><span>SnapSTL app</span><span id="app">…</span></div>
  <div class="row"><span>Model page</span><span id="model" class="model">…</span></div>
  <div class="row"><span>Working tab</span><span id="work">…</span></div>
  <div class="status" id="status">—</div>
  <button id="open" class="primary">Open model page</button>
  <button id="use">Use this tab</button>
  <div class="hint" id="msg"></div>
  <div class="hint">The helper only works in its working tab, and only while that tab shows the model page set in SnapSTL → Settings → MakerWorld model page link. Keep it open, ideally in its own window.</div>
  <script src="popup.js"></script>
</body>
</html>
