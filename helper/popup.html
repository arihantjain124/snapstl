<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SnapSTL Helper</title>
<style>
:root{--bg:#fff;--line:#e3e1db;--text:#1f1e1c;--muted:#6b6a65;--accent:#1f6fd1;--ok:#2e7d32;--err:#b42318}
@media (prefers-color-scheme:dark){:root{--bg:#242423;--line:#3a3936;--text:#ecebe6;--muted:#a19f98;--accent:#6aa5ee;--ok:#8fd18f;--err:#f19a90}}
body{margin:0;width:300px;padding:14px;font:13px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
h1{font-size:15px;margin:0 0 10px;font-weight:600}
.row{display:flex;justify-content:space-between;margin:4px 0}
.ok{color:var(--ok)}.err{color:var(--err)}
.status{margin-top:10px;padding:8px;border:1px solid var(--line);border-radius:6px;min-height:18px}
button{width:100%;margin-top:10px;font:inherit;padding:7px;border-radius:6px;border:0;background:var(--accent);color:#fff;cursor:pointer}
.hint{color:var(--muted);font-size:12px;margin-top:8px}
</style>
</head>
<body>
  <h1>SnapSTL Helper</h1>
  <div class="row"><span>SnapSTL app</span><span id="app">…</span></div>
  <div class="row"><span>MakerWorld tab</span><span id="tab">…</span></div>
  <div class="status" id="status">—</div>
  <button id="open">Open MakerWorld tab</button>
  <div class="hint">Keep that tab open (its own window is best). Batches, pausing and progress are in the SnapSTL app.</div>
  <script src="popup.js"></script>
</body>
</html>
