# Bambuddy (print-farm manager) + its slicer service, in Docker — set up by
# scripts/windows/bambuddy-server.ps1 (Windows) or scripts/bambuddy-server.sh (Mac / Linux),
# on the computer that runs Bambuddy for every SnapSTL computer.
#
# From Bambuddy's own files (github.com/maziggy/bambuddy: docker-compose.yml, slicer-api/), with:
#   * bridge networking (Docker Desktop on Windows / Mac has no host networking): only the web UI and
#     API on port 8000 is published, for SnapSTL computers on the network. Printers are added in
#     Bambuddy by IP address (discovery needs host networking).
#   * both slicer sidecars (Bambu Studio — recommended by Bambuddy — and OrcaSlicer). Bambuddy reaches
#     them inside Docker's network; on the host they're published to 127.0.0.1 only (they have no login).
#   * versions pinned to the Bambuddy release this SnapSTL was tested with (.env, written by the script).
name: snapstl-bambuddy

services:
  bambuddy:
    image: ghcr.io/maziggy/bambuddy:${BAMBUDDY_TAG:-1.3.1}
    container_name: snapstl-bambuddy
    cap_add:
      - NET_BIND_SERVICE
    ports:
      - "${BAMBUDDY_PORT:-8000}:8000"
    volumes:
      - bambuddy_data:/app/data
      - bambuddy_logs:/app/logs
    environment:
      - TZ=${TZ:-UTC}
      - PORT=8000
      # The slicer sidecars below, by their name inside Docker's network (used while Bambuddy's own
      # Settings → Slicer URL fields are left empty)
      - BAMBU_STUDIO_API_URL=http://bambu-studio-api:3000
      - SLICER_API_URL=http://orca-slicer-api:3000
    depends_on:
      - bambu-studio-api
      - orca-slicer-api
    restart: unless-stopped
    stop_grace_period: 30s

  bambu-studio-api:
    image: ghcr.io/maziggy/bambu-studio-api:${SIDECAR_TAG:-bambuddy-1.3.1}
    container_name: snapstl-bambu-studio-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:${BAMBU_API_PORT:-3001}:3000"
    volumes:
      - bambu_studio_data:/app/data
    environment:
      NODE_ENV: production
      PORT: "3000"
      MAX_MODEL_UPLOAD_MB: "512"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  orca-slicer-api:
    image: ghcr.io/maziggy/orca-slicer-api:${SIDECAR_TAG:-bambuddy-1.3.1}
    container_name: snapstl-orca-slicer-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:${ORCA_API_PORT:-3003}:3000"
    volumes:
      - orca_slicer_data:/app/data
    environment:
      NODE_ENV: production
      PORT: "3000"
      MAX_MODEL_UPLOAD_MB: "512"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  bambuddy_data:
  bambuddy_logs:
  bambu_studio_data:
  orca_slicer_data:
