# Bambuddy's slicer service in Docker — set up by scripts/windows/bambuddy-server.ps1 (Windows) or
# scripts/bambuddy-server.sh (Mac / Linux) on the Bambuddy computer.
#
# Bambuddy itself runs natively on that computer (on Windows: Bambuddy's own installer, a Windows service),
# so it sees the printers on the network directly (discovery). Only the slicer runs here, from Bambuddy's
# slicer-api/docker-compose.yml (github.com/maziggy/bambuddy):
#   * bambu-studio-api → 127.0.0.1:3001 (Bambu Studio CLI — recommended by Bambuddy)
#   * orca-slicer-api  → 127.0.0.1:3003 (OrcaSlicer CLI)
# Published on 127.0.0.1 only: the sidecars have no login, and Bambuddy runs on the same computer.
# Versions pinned to the Bambuddy release this SnapSTL was tested with (.env, written by the script).
name: snapstl-bambuddy

services:
  bambu-studio-api:
    image: ghcr.io/maziggy/bambu-studio-api:${SIDECAR_TAG:-bambuddy-1.3.1}
    container_name: snapstl-bambu-studio-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:${BAMBU_API_PORT:-3001}:3000"
    volumes:
      - bambu_studio_data:/app/data
    environment:
      NODE_ENV: production
      PORT: "3000"
      MAX_MODEL_UPLOAD_MB: "512"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  orca-slicer-api:
    image: ghcr.io/maziggy/orca-slicer-api:${SIDECAR_TAG:-bambuddy-1.3.1}
    container_name: snapstl-orca-slicer-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:${ORCA_API_PORT:-3003}:3000"
    volumes:
      - orca_slicer_data:/app/data
    environment:
      NODE_ENV: production
      PORT: "3000"
      MAX_MODEL_UPLOAD_MB: "512"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  bambu_studio_data:
  orca_slicer_data:
