<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SnapSTL sign in</title>
<style>
:root{--bg:#f6f5f2;--panel:#fff;--line:#e3e1db;--text:#1f1e1c;--muted:#6b6a65;--accent:#1f6fd1;--err:#b42318}
@media (prefers-color-scheme:dark){:root{--bg:#1b1b1a;--panel:#242423;--line:#3a3936;--text:#ecebe6;--muted:#a19f98;--accent:#6aa5ee;--err:#f19a90}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--text);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:16px}
form{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:24px;width:100%;max-width:340px}
h1{font-size:18px;margin:0 0 4px;font-weight:600}
p{margin:0 0 16px;color:var(--muted);font-size:13px}
input{width:100%;font:inherit;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text)}
button{width:100%;margin-top:12px;font:inherit;padding:9px;border-radius:8px;border:0;background:var(--accent);color:#fff;cursor:pointer}
.err{color:var(--err);font-size:13px;min-height:20px;margin-top:8px}
</style>
</head>
<body>
<form id="f">
  <h1>SnapSTL</h1>
  <p>Enter the team password.</p>
  <input id="pw" type="password" autocomplete="current-password" autofocus required>
  <button>Sign in</button>
  <div class="err" id="err"></div>
</form>
<script>
document.getElementById('f').onsubmit=async e=>{e.preventDefault();
  const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:document.getElementById('pw').value})});
  if(r.ok)location.href='/';else document.getElementById('err').textContent='Wrong password';};
</script>
</body>
</html>
